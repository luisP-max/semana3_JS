<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Mis Notas</h1>
            <p class="subtitle">Organiza tus ideas • Se guardan automáticamente</p>
        </header>
        
        <div class="input-container">
            <input type="text" id="inputNota" placeholder="Escribe una nueva nota...">
            <button id="btnAgregar">Agregar</button>
        </div>

        <ul id="listaNotas"></ul>

        <!-- Botón Borrar Todo -->
        <div class="actions">
            <button id="btnBorrarTodo" class="borrar-todo">Borrar Todo</button>
        </div>
    </div>

    <script src="manipulacion_dom.js"></script>
</body>
</html>
